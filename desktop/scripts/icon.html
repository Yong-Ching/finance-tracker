<!doctype html>
<!-- Renders build/icon.svg onto the macOS icon grid: the tile is 824px inside a
     1024px transparent canvas, with the soft drop shadow macOS icons carry.
     Regenerate build/icon.png with the command in desktop/README.md. -->
<html><head><style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; }
  img { position: absolute; left: 100px; top: 100px; width: 824px; height: 824px;
        filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .28)); }
</style></head>
<body><img src="../build/icon.svg" alt=""></body></html>
