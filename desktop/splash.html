<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>finance-tracker</title>
<style>
  :root { --bg: #fff; --fg: #111; --muted: #777; --rule: #e4e4e4; --log: #f5f5f5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0b0b; --fg: #eee; --muted: #888; --rule: #242424; --log: #141414; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  body { display: flex; flex-direction: column; -webkit-app-region: drag; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  #status { color: var(--muted); min-height: 1.4em; }
  #mode { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .bar { width: 180px; height: 2px; background: var(--rule); overflow: hidden; }
  .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--fg);
    animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  button { -webkit-app-region: no-drag; background: none; border: 0; color: var(--muted);
    font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline; }
  button:hover { color: var(--fg); }
  pre { -webkit-app-region: no-drag; display: none; margin: 0; height: 40vh; overflow: auto;
    padding: 12px 16px; background: var(--log); border-top: 1px solid var(--rule);
    font: 11px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; user-select: text; }
  body.log pre { display: block; }
  body.failed .bar { display: none; }
</style>
</head>
<body>
  <main>
    <h1>finance-tracker</h1>
    <div class="bar"></div>
    <div id="status">Starting</div>
    <div id="mode"></div>
    <button id="toggle">Show details</button>
  </main>
  <pre id="log"></pre>
<script>
  const log = document.getElementById("log");
  const toggle = document.getElementById("toggle");
  window.setStatus = (s) => {
    document.getElementById("status").textContent = s;
    document.body.classList.toggle("failed", s === "Could not start");
  };
  window.setMode = (s) => { document.getElementById("mode").textContent = s; };
  window.appendLog = (chunk) => {
    const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
    log.textContent += chunk;
    if (log.textContent.length > 200000) log.textContent = log.textContent.slice(-150000);
    if (atEnd) log.scrollTop = log.scrollHeight;
  };
  window.showLog = (on) => {
    document.body.classList.toggle("log", on);
    toggle.textContent = on ? "Hide details" : "Show details";
    log.scrollTop = log.scrollHeight;
  };
  toggle.onclick = () => window.showLog(!document.body.classList.contains("log"));
</script>
</body>
</html>
